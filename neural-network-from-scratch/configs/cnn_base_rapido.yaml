# Fase 3 - CNN base, PROTOCOLO RÁPIDO (8 épocas) para hardware limitado.
# este arquivo a partir de configs/experiments.yaml.
seed: 42
output_dir: results/cnn/E0_base

model:
  type: cnn
  channels: [32, 64]
  hidden: 128
  batchnorm: false
  dropout: 0.0

optimizer:
  name: adam
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0

scheduler:
  name: none            # none | cosine | step
  step_size: 10
  gamma: 0.1

training:
  epochs: 8
  batch_size: 128
  patience: 5
  augmentation: false
