# Fase 1 - MLP em NumPy
seed: 42
output_dir: results/numpy_mlp

model:
  hidden: [128, 64]
  activation: relu      # relu | sigmoid | tanh
  dropout: 0.0
  init: he              # he | xavier

optimizer:
  name: adam            # sgd | momentum | adam
  lr: 0.001
  momentum: 0.9         # usado só por momentum
  weight_decay: 0.0

training:
  epochs: 30
  batch_size: 64
  patience: 5           # early stopping
