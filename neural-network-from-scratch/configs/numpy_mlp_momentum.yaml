# Fase 1 - MLP em NumPy, otimizador momentum (comparação com o Adam)
seed: 42
output_dir: results/numpy_mlp_momentum

model:
  hidden: [128, 64]
  activation: relu      # relu | sigmoid | tanh
  dropout: 0.0
  init: he              # he | xavier

optimizer:
  name: momentum
  lr: 0.05
  momentum: 0.9         # usado só por momentum
  weight_decay: 0.0

training:
  epochs: 30
  batch_size: 64
  patience: 5           # early stopping
